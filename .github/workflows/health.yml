name: Production health
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions: {}
concurrency:
  group: production-health
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Require two consecutive unhealthy probes
        shell: bash
        env:
          REQUIRE_GRADING_HEALTH: ${{ vars.REQUIRE_GRADING_HEALTH }}
        run: |
          probe() {
            curl --fail --silent --show-error --connect-timeout 10 --max-time 20 \
              https://devshark.app/api/health --output /tmp/health.json &&
              jq -e '
                (.ts | sub("\\.[0-9]+Z$"; "Z") | fromdateiso8601) as $reported |
                (now | floor) as $checked |
                .ok == true and .status == "healthy" and
                .dependencies.database == "ok" and .dependencies.serviceRole == "ok" and
                .dependencies.rateLimiter == "configured" and
                (.dependencies.grading == "ok" or
                 ((.dependencies | has("grading") | not) and env.REQUIRE_GRADING_HEALTH != "true")) and
                $reported >= ($checked - 300) and $reported <= ($checked + 300)
              ' /tmp/health.json
          }
          if probe; then exit 0; fi
          sleep 30
          if probe; then exit 0; fi
          echo '::error::devshark.app failed two consecutive health probes'
          exit 1
