# Publishes the two GitHub Packages of this repository (docs/packages.md):
# - the npm package @lukaskourilcz/coding-evaluator, on a coding-evaluator-v* tag
# - the container image ghcr.io/lukaskourilcz/devshark, on a docker-v* tag
# Both can also be started by hand from main in the Actions tab.
name: Packages
on:
  push:
    tags: ['coding-evaluator-v*', 'docker-v*']
  workflow_dispatch:
    inputs:
      target:
        description: Which package to publish
        type: choice
        options: [coding-evaluator, docker]
        required: true
permissions:
  contents: read
concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  coding-evaluator:
    if: startsWith(github.ref, 'refs/tags/coding-evaluator-v') || (github.ref == 'refs/heads/main' && inputs.target == 'coding-evaluator')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@lukaskourilcz'
      # esbuild and typescript come from the root install.
      - run: npm ci --no-audit
      - name: Tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: packages/coding-evaluator
        run: |
          version=$(node -p "require('./package.json').version")
          test "${GITHUB_REF_NAME}" = "coding-evaluator-v${version}" || { echo "tag ${GITHUB_REF_NAME} does not match version ${version}"; exit 1; }
      - run: npm run build && npm test
        working-directory: packages/coding-evaluator
      - run: npm publish
        working-directory: packages/coding-evaluator
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    if: startsWith(github.ref, 'refs/tags/docker-v') || (github.ref == 'refs/heads/main' && inputs.target == 'docker')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/lukaskourilcz/devshark
          tags: |
            type=match,pattern=docker-v(.*),group=1
            type=raw,value=latest
            type=sha
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
