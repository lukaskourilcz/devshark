# Publishes the two GitHub Packages of this repository (docs/packages.md):
# - the npm package @lukaskourilcz/coding-evaluator, on a coding-evaluator-v* tag
# - the container image ghcr.io/lukaskourilcz/devshark, on a docker-v* tag
# Both can also be started by hand from the Actions tab.
name: Packages
on:
  push:
    tags: ['coding-evaluator-v*', 'docker-v*']
  workflow_dispatch:
    inputs:
      target:
        description: Which package to publish
        type: choice
        options: [coding-evaluator, docker]
        required: true
permissions:
  contents: read
concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  coding-evaluator:
    if: startsWith(github.ref, 'refs/tags/coding-evaluator-v') || inputs.target == 'coding-evaluator'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@lukaskourilcz'
      # esbuild and typescript come from the root install.
      - run: npm ci --no-audit
      - name: Tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: packages/coding-evaluator
        run: |
          version=$(node -p "require('./package.json').version")
          test "${GITHUB_REF_NAME}" = "coding-evaluator-v${version}" || { echo "tag ${GITHUB_REF_NAME} does not match version ${version}"; exit 1; }
      - run: npm run build && npm test
        working-directory: packages/coding-evaluator
      - run: npm publish
        working-directory: packages/coding-evaluator
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    if: startsWith(github.ref, 'refs/tags/docker-v') || inputs.target == 'docker'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/lukaskourilcz/devshark
          tags: |
            type=match,pattern=docker-v(.*),group=1
            type=raw,value=latest
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
