name: Product quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  sql:
    # Builds the database from supabase-schema.sql and every numbered
    # migration on Supabase's own Postgres 17 image, then runs the behaviour
    # tests in supabase/tests (XP once, vouchers once, the 30-day board,
    # account erasure, grants and RLS). See scripts/test-sql.mjs.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: supabase/postgres:17.6.1.171
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -h 127.0.0.1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm run test:sql
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
  # verify requires every gate, including the shared build producer. A
  # skipped or cancelled gate fails it. Consumers verify the build head and
  # hashes before running the static and browser checks against those bytes.
  quickjs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
      - run: npm ci --no-audit && npm ci --no-audit --prefix client
      - name: Rebuild modified QuickJS runtime from pinned sources
        env:
          QUICKJS_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -n "$QUICKJS_BASE_SHA" && "$QUICKJS_BASE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            [[ "$QUICKJS_BASE_SHA" =~ ^[a-f0-9]{40}$ ]] || exit 1
            git fetch --no-tags --depth=1 origin "$QUICKJS_BASE_SHA"
            if git diff --quiet "$QUICKJS_BASE_SHA" HEAD -- lib/coding/vendor lib/coding/quickjs-variant.ts scripts/rebuild-quickjs-sort.mjs package.json package-lock.json client/package-lock.json; then
              echo "QuickJS inputs unchanged; required runtime integrity tests still run below."
              exit 0
            fi
          fi
          npm run check:quickjs-build
  client-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
      - run: npm ci --no-audit && npm ci --no-audit --prefix client
      - run: |
          # The browser checks below run against this build, so it signs in the
          # way production does: with the placeholder Supabase project that
          # check:bundle measures with. tests/browser/lazy-auth.spec.ts needs it.
          VITE_SUPABASE_URL=$(node -p "require('./docs/quality/bundle-budget.json').measuredBuild.env.VITE_SUPABASE_URL")
          VITE_SUPABASE_ANON_KEY=$(node -p "require('./docs/quality/bundle-budget.json').measuredBuild.env.VITE_SUPABASE_ANON_KEY")
          export VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY
          npm run build
        id: build
        env:
          VITE_PRODUCT: devshark
          VITE_LOCK_SUBJECT: webdev
      - run: npm run check:ci-build-artifact
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-client-${{ github.sha }}
          path: artifacts/client-build.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
  static:
    needs: client-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
      - run: npm ci --no-audit && npm ci --no-audit --prefix client
      - run: npm run typecheck:api && npm run typecheck:scripts && npm run typecheck:tooling --prefix client
      - run: npm run audit:native-reviews
      - run: npm run check:unused && npm run check:security && npm run check:docs-archive && npm run check:deploy-contexts
      - name: Compare new binaries with the event base
        env:
          BINARY_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          [[ "$BINARY_BASE_SHA" =~ ^[a-f0-9]{40}$ && "$BINARY_BASE_SHA" != "0000000000000000000000000000000000000000" ]] || exit 1
          git fetch --no-tags --depth=1 origin "$BINARY_BASE_SHA"
          npm run check:binary-size
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: quality-client-${{ github.sha }}
          path: artifacts
      - run: node scripts/ci-build-artifact.mjs restore artifacts/client-build.tar
      - run: |
          # The browser checks below run against this build, so it signs in the
          # way production does: with the placeholder Supabase project that
          # check:bundle measures with. tests/browser/lazy-auth.spec.ts needs it.
          VITE_SUPABASE_URL=$(node -p "require('./docs/quality/bundle-budget.json').measuredBuild.env.VITE_SUPABASE_URL")
          VITE_SUPABASE_ANON_KEY=$(node -p "require('./docs/quality/bundle-budget.json').measuredBuild.env.VITE_SUPABASE_ANON_KEY")
          export VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY
          npm run check:images && npm run check:public && npm run check:bundle
        id: check-build
        env:
          VITE_PRODUCT: devshark
          VITE_LOCK_SUBJECT: webdev
      - run: npm audit --omit=dev && npm audit --omit=dev --prefix client
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
      - run: npm ci --no-audit && npm ci --no-audit --prefix client
      - run: npm run test:performance && npm run test:launch && npm run test:coding-auth && npm run test:grading-integrity && npm run test:path-authority && npm run test:react-authority && npm run test:paths && npm run test:billing && npm run test:fallbacks && npm run test:garden && npm run test:live-grading && npm run test:client
  coding:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
      - run: npm ci --no-audit && npm ci --no-audit --prefix client
      - run: npm run test:coding
  browser:
    needs: client-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
      - run: npm ci --no-audit && npm ci --no-audit --prefix client
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: quality-client-${{ github.sha }}
          path: artifacts
      - run: node scripts/ci-build-artifact.mjs restore artifacts/client-build.tar
        id: build
      - name: Read installed browser revision
        id: playwright
        run: echo "revision=$(node -p "require('node:crypto').createHash('sha256').update(require('node:fs').readFileSync('node_modules/playwright-core/browsers.json')).digest('hex')")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-chromium-${{ steps.playwright.outputs.revision }}
      - run: npx playwright install --with-deps chromium
      - name: Browser checks
        run: |
          npm run preview --prefix client -- --host 0.0.0.0 --port 4173 > /tmp/preview.log 2>&1 &
          node scripts/wait-for-preview.mjs
          PLAYWRIGHT_HTML_REPORT=playwright-report/chromium npm run test:browser -- --project=chromium --workers=2 --output=test-results/chromium tests/browser/public.spec.ts tests/browser/images.spec.ts tests/browser/guide-startup.spec.ts tests/browser/profile-leaderboard-preferences.spec.ts tests/browser/profile-path-picker.spec.ts tests/browser/admin.spec.ts tests/browser/evolving.spec.ts tests/browser/coding-pages.spec.ts tests/browser/coding-workbench.spec.ts tests/browser/mobile-safari.spec.ts tests/browser/consent-reflow.spec.ts tests/browser/coding-drafts.spec.ts tests/browser/learning-release.spec.ts tests/browser/learn-sections.spec.ts tests/browser/fde-hub.spec.ts tests/browser/fde-taster.spec.ts tests/browser/fde-positioning.spec.ts tests/browser/interview-shelf.spec.ts tests/browser/path-content-shapes.spec.ts tests/browser/portfolio-export.spec.ts tests/browser/diagnostic-overview.spec.ts tests/browser/dsa-advanced.spec.ts tests/browser/segmented.spec.ts tests/browser/on-accent.spec.ts tests/browser/navigation.spec.ts tests/browser/lazy-auth.spec.ts tests/browser/sign-in.spec.ts tests/browser/route-errors.spec.ts tests/browser/first-load.spec.ts tests/browser/home-sample.spec.ts tests/browser/routes-axe.spec.ts tests/browser/daily.spec.ts tests/browser/launch-offer.spec.ts tests/browser/triage-private.spec.ts
          export CHROME_BIN=$(node -e "console.log(require('@playwright/test').chromium.executablePath())")
          TOPIC=javascript-closures
          RESPONSIVE_WORKERS=2 npm run check:responsive -- --routes /,/quiz,/topics/$TOPIC,/daily,/learn,/learn/web-developer,/coding,/coding/javascript,/coding/javascript/js-double-numbers,/leaderboard,/profile,/premium,/play,/challenge,/today,/cards,/shop,/privacy,/terms,/not-found-responsive-check --widths 360,390,430,768,820,1024,1280,1366,1440
          RESPONSIVE_THEME=dark RESPONSIVE_WORKERS=2 npm run check:responsive -- --routes /,/quiz,/topics/$TOPIC,/daily,/learn,/learn/web-developer,/coding,/coding/javascript,/coding/javascript/js-double-numbers,/leaderboard,/profile,/premium,/play,/challenge,/today,/cards,/shop,/privacy,/terms,/not-found-responsive-check --widths 390,820,1280
          RESPONSIVE_ZOOM=200 RESPONSIVE_WORKERS=2 npm run check:responsive -- --routes / --widths 1280
          RESPONSIVE_ZOOM=400 RESPONSIVE_WORKERS=2 npm run check:responsive -- --routes / --widths 1280
          npm run test:harness
      - if: ${{ !cancelled() && steps.build.conclusion == 'success' }}
        name: Storybook and performance
        run: |
          npm run audit:performance
          npm run build:storybook
          npm run storybook --prefix client -- --ci > /tmp/storybook.log 2>&1 &
          TEST_BASE_URL=http://localhost:6006 node scripts/wait-for-preview.mjs
          STORYBOOK_URL=http://localhost:6006 PLAYWRIGHT_HTML_REPORT=playwright-report/storybook npm run test:browser -- --project=chromium --output=test-results/storybook tests/browser/storybook.spec.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: quality
          path: |
            artifacts/
            playwright-report/
            test-results/
            client/storybook-static/
          retention-days: 14
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CONTAINER_BASE_SHA: 0f35d67df7e3ae0c2cbd17eb4c44a18c7bf8d83c
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit
      - name: Fetch the published container baseline
        run: git fetch --no-tags --depth=1 origin "$CONTAINER_BASE_SHA"
      - run: npm run test:container
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: container-measurement
          path: artifacts/container/
          if-no-files-found: warn
          retention-days: 14
  verify:
    needs: [quickjs, client-build, static, tests, coding, browser, container]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "quickjs=${{ needs.quickjs.result }} client-build=${{ needs.client-build.result }} static=${{ needs.static.result }} tests=${{ needs.tests.result }} coding=${{ needs.coding.result }} browser=${{ needs.browser.result }} container=${{ needs.container.result }}"
      - if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: exit 1
