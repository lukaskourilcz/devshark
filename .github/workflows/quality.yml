name: Product quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  sql:
    # Builds the database from supabase-schema.sql and every numbered
    # migration on Supabase's own Postgres 17 image, then runs the behaviour
    # tests in supabase/tests (XP once, vouchers once, the 30-day board,
    # account erasure, grants and RLS). See scripts/test-sql.mjs.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: supabase/postgres:17.6.1.171
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -h 127.0.0.1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run test:sql
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
  # verify used to run every gate in one job and reached 44 minutes of a
  # 60-minute cap on 21 October. The gates now run as parallel jobs, and the
  # job named verify (the required check) passes only when every one of them
  # passed: a skipped or cancelled gate fails it.
  quickjs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
      - run: npm ci --no-audit && npm ci --no-audit --prefix client
      - name: Rebuild modified QuickJS runtime from pinned sources
        env:
          QUICKJS_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -n "$QUICKJS_BASE_SHA" && "$QUICKJS_BASE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            [[ "$QUICKJS_BASE_SHA" =~ ^[a-f0-9]{40}$ ]] || exit 1
            git fetch --no-tags --depth=1 origin "$QUICKJS_BASE_SHA"
            if git diff --quiet "$QUICKJS_BASE_SHA" HEAD -- lib/coding/vendor lib/coding/quickjs-variant.ts scripts/rebuild-quickjs-sort.mjs package.json package-lock.json client/package-lock.json; then
              echo "QuickJS inputs unchanged; required runtime integrity tests still run below."
              exit 0
            fi
          fi
          npm run check:quickjs-build
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
      - run: npm ci --no-audit && npm ci --no-audit --prefix client
      - run: npm run typecheck:api && npm run typecheck:scripts && npm run typecheck:tooling --prefix client
      - run: npm run audit:native-reviews
      - run: npm run check:unused && npm run check:security
      - run: |
          # The browser checks below run against this build, so it signs in the
          # way production does: with the placeholder Supabase project that
          # check:bundle measures with. tests/browser/lazy-auth.spec.ts needs it.
          VITE_SUPABASE_URL=$(node -p "require('./docs/quality/bundle-budget.json').measuredBuild.env.VITE_SUPABASE_URL")
          VITE_SUPABASE_ANON_KEY=$(node -p "require('./docs/quality/bundle-budget.json').measuredBuild.env.VITE_SUPABASE_ANON_KEY")
          export VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY
          npm run build && npm run check:public && npm run check:bundle
        id: build
        env:
          VITE_PRODUCT: devshark
          VITE_LOCK_SUBJECT: webdev
      - run: npm audit --omit=dev && npm audit --omit=dev --prefix client
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
      - run: npm ci --no-audit && npm ci --no-audit --prefix client
      - run: npm run test:performance && npm run test:launch && npm run test:coding-auth && npm run test:grading-integrity && npm run test:path-authority && npm run test:react-authority && npm run test:paths && npm run test:billing && npm run test:fallbacks && npm run test:garden && npm run test:live-grading && npm run test:client
  coding:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
      - run: npm ci --no-audit && npm ci --no-audit --prefix client
      - run: npm run test:coding
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
      - run: npm ci --no-audit && npm ci --no-audit --prefix client
      - run: |
          # The browser checks below run against this build, so it signs in the
          # way production does: with the placeholder Supabase project that
          # check:bundle measures with. tests/browser/lazy-auth.spec.ts needs it.
          VITE_SUPABASE_URL=$(node -p "require('./docs/quality/bundle-budget.json').measuredBuild.env.VITE_SUPABASE_URL")
          VITE_SUPABASE_ANON_KEY=$(node -p "require('./docs/quality/bundle-budget.json').measuredBuild.env.VITE_SUPABASE_ANON_KEY")
          export VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY
          npm run build
        id: build
        env:
          VITE_PRODUCT: devshark
          VITE_LOCK_SUBJECT: webdev
      - run: npx playwright install --with-deps chromium
      - name: Browser checks
        run: |
          npm run preview --prefix client -- --host 0.0.0.0 --port 4173 > /tmp/preview.log 2>&1 &
          node scripts/wait-for-preview.mjs
          npm run test:browser -- tests/browser/public.spec.ts
          npm run test:browser -- tests/browser/guide-startup.spec.ts tests/browser/profile-leaderboard-preferences.spec.ts tests/browser/profile-path-picker.spec.ts tests/browser/admin.spec.ts
          npm run test:browser -- tests/browser/evolving.spec.ts
          npm run test:browser -- tests/browser/coding-pages.spec.ts
          npm run test:browser -- tests/browser/coding-workbench.spec.ts
          npm run test:browser -- tests/browser/coding-drafts.spec.ts
          npm run test:browser -- tests/browser/learning-release.spec.ts tests/browser/learn-sections.spec.ts
          npm run test:browser -- tests/browser/fde-hub.spec.ts tests/browser/fde-taster.spec.ts tests/browser/fde-positioning.spec.ts tests/browser/interview-shelf.spec.ts
          npm run test:browser -- tests/browser/path-content-shapes.spec.ts tests/browser/portfolio-export.spec.ts tests/browser/diagnostic-overview.spec.ts tests/browser/dsa-advanced.spec.ts
          npm run test:browser -- tests/browser/segmented.spec.ts
          npm run test:browser -- tests/browser/on-accent.spec.ts
          npm run test:browser -- tests/browser/navigation.spec.ts
          npm run test:browser -- tests/browser/lazy-auth.spec.ts
          npm run test:browser -- tests/browser/sign-in.spec.ts
          npm run test:browser -- tests/browser/route-errors.spec.ts
          npm run test:browser -- tests/browser/first-load.spec.ts
          npm run test:browser -- tests/browser/home-sample.spec.ts
          npm run test:browser -- tests/browser/routes-axe.spec.ts
          npm run test:browser -- tests/browser/daily.spec.ts
          npm run test:browser -- tests/browser/launch-offer.spec.ts
          export CHROME_BIN=$(node -e "console.log(require('@playwright/test').chromium.executablePath())")
          TOPIC=javascript-closures
          npm run check:responsive -- --routes /,/quiz,/topics/$TOPIC,/daily,/not-found-responsive-check --widths 360,390,430,768,1024,1280,1440
          RESPONSIVE_THEME=dark npm run check:responsive -- --routes /,/topics/$TOPIC,/daily --widths 390,768,1280
          npm run test:harness
      - if: ${{ !cancelled() && steps.build.conclusion == 'success' }}
        name: Storybook and performance
        run: |
          npm run audit:performance
          npm run build:storybook
          npm run storybook --prefix client -- --ci > /tmp/storybook.log 2>&1 &
          TEST_BASE_URL=http://localhost:6006 node scripts/wait-for-preview.mjs
          STORYBOOK_URL=http://localhost:6006 npm run test:browser -- tests/browser/storybook.spec.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality
          path: |
            artifacts/
            playwright-report/
            test-results/
            client/storybook-static/
          retention-days: 14
  verify:
    needs: [quickjs, static, tests, coding, browser]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "quickjs=${{ needs.quickjs.result }} static=${{ needs.static.result }} tests=${{ needs.tests.result }} coding=${{ needs.coding.result }} browser=${{ needs.browser.result }}"
      - if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: exit 1
