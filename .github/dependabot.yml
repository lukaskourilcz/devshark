version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Prague
    open-pull-requests-limit: 3
    versioning-strategy: increase
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps-dev)
    groups:
      react-grader:
        patterns:
          - react
          - react-dom
          - jsdom
          - "@testing-library/*"
          - sucrase
        update-types: [minor, patch]
      root-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
      root-security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      - dependency-name: quickjs-emscripten
      - dependency-name: "@jitl/quickjs-*"
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /client
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Prague
    open-pull-requests-limit: 3
    versioning-strategy: increase
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps-dev)
    groups:
      react-grader:
        patterns:
          - react
          - react-dom
          - "@testing-library/*"
          - sucrase
        update-types: [minor, patch]
      client-minor-patch:
        patterns: ["*"]
        exclude-patterns: [satori]
        update-types: [minor, patch]
      client-security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Prague
    groups:
      actions:
        patterns: ["*"]
